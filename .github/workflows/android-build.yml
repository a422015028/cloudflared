name: Android Build

on:
  push:
    branches: [master, main]
    tags:
      - '*'
  pull_request:
    branches: [master, main]
  workflow_dispatch:

env:
  GO_VERSION: '1.26.x'
  BINARY_NAME: cloudflared

jobs:
  build-android:
    name: Build Android (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64-v8a
            goos: android
            goarch: arm64
            goarm: ''
          - arch: armeabi-v7a
            goos: android
            goarch: arm
            goarm: '7'
          - arch: x86
            goos: android
            goarch: '386'
            goarm: ''
          - arch: x86_64
            goos: android
            goarch: amd64
            goarm: ''

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Get version
        id: version
        run: echo "version=$(git describe --tags --always --match "[0-9][0-9][0-9][0-9].*.*")" >> $GITHUB_OUTPUT
        shell: bash

      - name: Build cloudflared for Android ${{ matrix.arch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: '0'
        run: |
          BUILD_DATE=$(git log -1 --format="%ad" --date=format-local:'%Y-%m-%dT%H:%M UTC' -- RELEASE_NOTES)
          LDFLAGS_VALUE="-X \"main.Version=${{ steps.version.outputs.version }}\" -X \"main.BuildTime=$BUILD_DATE\""

          if [ -n "$GOARM" ]; then
            export GOARM
          fi

          go build -mod=readonly -trimpath -ldflags "$LDFLAGS_VALUE" -o ${{ env.BINARY_NAME }}-${{ matrix.arch }} github.com/cloudflare/cloudflared/cmd/cloudflared

      - name: Verify binary
        run: |
          file ${{ env.BINARY_NAME }}-${{ matrix.arch }}
          ls -lh ${{ env.BINARY_NAME }}-${{ matrix.arch }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BINARY_NAME }}-android-${{ matrix.arch }}
          path: ${{ env.BINARY_NAME }}-${{ matrix.arch }}
          if-no-files-found: error

  # 汇总所有架构到一个 artifact（可选）
  package-all:
    name: Package all Android architectures
    needs: build-android
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: ${{ env.BINARY_NAME }}-android-*
          merge-multiple: false

      - name: Create combined archive
        run: |
          mkdir -p output
          VERSION=${GITHUB_REF_NAME:-latest}
          tar -czf output/${{ env.BINARY_NAME }}-android-all-${VERSION}.tar.gz -C artifacts .
          ls -lh output/

      - name: Upload combined archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BINARY_NAME }}-android-all
          path: output/*
          if-no-files-found: error
